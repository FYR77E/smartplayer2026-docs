<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SmartPlayer — Быстрый старт (HTML)</title>
    <meta http-equiv="refresh" content="0; url=/generated/03-быстрый-старт" />
    <link rel="canonical" href="/generated/03-%D0%B1%D1%8B%D1%81%D1%82%D1%80%D1%8B%D0%B9-%D1%81%D1%82%D0%B0%D1%80%D1%82" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --fg: #eaf0ff;
        --muted: rgba(234, 240, 255, 0.75);
        --card: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --btn: #4f7cff;
        --btnFg: #ffffff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f8fc;
          --fg: #0c1222;
          --muted: rgba(12, 18, 34, 0.7);
          --card: rgba(12, 18, 34, 0.04);
          --border: rgba(12, 18, 34, 0.12);
          --btn: #2457ff;
          --btnFg: #ffffff;
        }
      }
      body {
        margin: 0;
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 20px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--btn);
        color: var(--btnFg);
        text-decoration: none;
        font-weight: 600;
      }
      a.link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--fg);
        text-decoration: none;
        font-weight: 600;
        background: transparent;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Быстрый старт (HTML)</h1>
      <p>
        Перенаправляю на актуальную страницу “Быстрый старт” внутри документации…
      </p>
      <div class="row">
        <a class="button" href="/generated/03-%D0%B1%D1%8B%D1%81%D1%82%D1%80%D1%8B%D0%B9-%D1%81%D1%82%D0%B0%D1%80%D1%82">
          Открыть быстрый старт
        </a>
        <a class="link" href="/">
          На главную
        </a>
      </div>
      <p style="margin-top: 14px">
        Если редирект не сработал, открой ссылку вручную:
        <code>/generated/03-быстрый-старт</code>
      </p>
    </div>
  </body>
</html>
